media:
  input: assets
  output: /assets
content:
  - name: website
    label: Website Settings
    type: file
    path: content/website.json
    format: json
    fields:
      - name: site_title
        label: Website Title
        type: string
      - name: hero_subtitle
        label: Hero Subtitle
        type: string
      - name: about_heading
        label: About Heading
        type: string
      - name: about_text
        label: About Description
        type: text
      - name: booking_heading
        label: Booking Heading
        type: string
      - name: booking_description
        label: Booking Description
        type: text
      - name: hero_location
        label: Hero Location
        type: string
        required: false
      - name: hero_primary_button
        label: Hero Primary Button
        type: string
        required: false
      - name: hero_secondary_button
        label: Hero Secondary Button
        type: string
        required: false
      - name: card_tattoos_title
        label: Card Tattoos Title
        type: string
        required: false
      - name: card_tattoos_description
        label: Card Tattoos Description
        type: text
        required: false
      - name: card_studio_title
        label: Card Studio Title
        type: string
        required: false
      - name: card_studio_description
        label: Card Studio Description
        type: text
        required: false
      - name: card_shop_title
        label: Card Shop Title
        type: string
        required: false
      - name: card_shop_description
        label: Card Shop Description
        type: text
        required: false
      - name: card_about_title
        label: Card About Title
        type: string
        required: false
      - name: card_about_description
        label: Card About Description
        type: text
        required: false
      - name: about_eyebrow
        label: About Eyebrow
        type: string
        required: false
      - name: tattoos_eyebrow
        label: Tattoos Eyebrow
        type: string
        required: false
      - name: tattoos_heading
        label: Tattoos Heading
        type: string
        required: false
      - name: tattoos_description
        label: Tattoos Description
        type: text
        required: false
      - name: studio_eyebrow
        label: Studio Eyebrow
        type: string
        required: false
      - name: studio_heading
        label: Studio Heading
        type: string
        required: false
      - name: studio_description
        label: Studio Description
        type: text
        required: false
      - name: shop_eyebrow
        label: Shop Eyebrow
        type: string
        required: false
      - name: shop_heading
        label: Shop Heading
        type: string
        required: false
      - name: shop_description
        label: Shop Description
        type: text
        required: false
      - name: shop_status
        label: Shop Status
        type: text
        required: false
      - name: booking_eyebrow
        label: Booking Eyebrow
        type: string
        required: false
  - name: tattoos
    label: Tattoo Portfolio
    type: collection
    path: content/tattoos
    format: json
    fields:
      - name: title
        label: Title
        type: string
      - name: image
        label: Image
        type: image
      - name: video
        label: Video
        type: file
        required: false
      - name: category
        label: Category
        type: select
        options:
          values:
            - value: color
              label: Color
            - value: black-grey
              label: Black & Grey
  - name: studio
    label: Art Studio
    type: collection
    path: content/studio
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    fields:
      - name: title
        label: Artwork Title
        type: string
        required: false
      - name: image
        label: Image
        type: image
        required: false
      - name: video
        label: Video
        type: file
        required: false
      - name: category
        label: Category
        type: select
        options:
          values:
            - value: paintings
              label: Paintings
            - value: drawings
              label: Drawings
            - value: mixed-media
              label: Mixed Media
      - name: medium
        label: Medium
        type: string
        required: false
      - name: description
        label: Description
        type: text
        required: false
